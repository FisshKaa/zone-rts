<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ЗОНА · воксельная карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #d7e2c8;
    --dim: #7f8a72;
    --panel: rgba(11, 15, 10, 0.82);
    --panel-edge: rgba(126, 154, 92, 0.28);
    --geiger: #b9d14a;
    --rust: #c46a3a;
    --danger: #d3453a;
    --grid: rgba(126, 154, 92, 0.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070a; color: var(--ink);
    font-family: 'Rajdhani', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  /* ---- loading ---- */
  #boot {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-content: center; gap: 14px; text-align: center;
    background: radial-gradient(120% 90% at 50% 30%, #10160f 0%, #05070a 70%);
    transition: opacity .6s ease; letter-spacing: .04em;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .rad {
    width: 46px; height: 46px; margin: 0 auto; border-radius: 50%;
    border: 2px solid var(--geiger); border-right-color: transparent;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot small { color: var(--dim); font-family: 'Share Tech Mono', monospace; font-size: 12px; }

  /* ---- HUD frame ---- */
  .hud { position: fixed; z-index: 20; pointer-events: none; }
  .panel {
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    backdrop-filter: blur(6px);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
  .corner { position: relative; }
  .corner::before, .corner::after {
    content: ""; position: absolute; width: 9px; height: 9px; border: 1px solid var(--geiger); opacity: .7;
  }
  .corner::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* top-left: identity */
  #brand { top: 16px; left: 16px; }
  #brand .panel { padding: 10px 14px 11px; min-width: 210px; }
  #brand h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .32em;
    color: var(--ink); line-height: 1;
  }
  #brand .sub {
    margin-top: 5px; font-family: 'Share Tech Mono', monospace; font-size: 10.5px;
    color: var(--dim); letter-spacing: .12em;
  }
  #brand .sector {
    margin-top: 8px; font-family: 'Share Tech Mono', monospace; font-size: 12px;
    color: var(--geiger); letter-spacing: .06em;
  }

  /* top-right: telemetry */
  #tele { top: 16px; right: 16px; text-align: right; }
  #tele .panel { padding: 10px 14px; min-width: 180px; }
  .readout { display: flex; justify-content: space-between; gap: 18px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px; line-height: 1.7; }
  .readout .k { color: var(--dim); letter-spacing: .06em; }
  .readout .v { color: var(--ink); }
  .readout .v.warn { color: var(--rust); }
  .readout .v.hot { color: var(--danger); }
  #weatherBtn {
    margin-top: 8px; width: 100%; pointer-events: auto; cursor: pointer;
    font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: .1em;
    color: var(--ink); background: rgba(126,154,92,.10);
    border: 1px solid var(--panel-edge); padding: 6px 8px; transition: background .15s;
  }
  #weatherBtn:hover { background: rgba(126,154,92,.22); }

  /* bottom-left: factions */
  #factions { bottom: 16px; left: 16px; }
  #factions .panel { padding: 10px 12px 12px; width: 236px; }
  #factions .head {
    font-family: 'Share Tech Mono', monospace; font-size: 10.5px; color: var(--dim);
    letter-spacing: .14em; margin-bottom: 8px;
  }
  .fac { display: flex; align-items: center; gap: 9px; padding: 5px 7px; cursor: pointer;
    border: 1px solid transparent; transition: background .12s, border-color .12s; }
  .fac:hover { background: rgba(126,154,92,.08); }
  .fac.active { background: rgba(126,154,92,.12); border-color: var(--panel-edge); }
  .fac .dot { width: 11px; height: 11px; border-radius: 2px; box-shadow: 0 0 8px currentColor; flex: none; }
  .fac .nm { font-size: 15px; font-weight: 600; letter-spacing: .02em; line-height: 1; }
  .fac .cnt { margin-left: auto; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--dim); }

  /* bottom-center: controls hint */
  #hint {
    bottom: 18px; left: 50%; transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--dim);
    letter-spacing: .08em; text-align: center; opacity: .82;
  }
  #hint b { color: var(--geiger); font-weight: 400; }

  /* map labels */
  #labels { position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; transform: translate(-50%, -140%);
    font-family: 'Share Tech Mono', monospace; white-space: nowrap;
    text-shadow: 0 1px 4px #000, 0 0 2px #000; will-change: transform, opacity;
  }
  .lbl .en { font-size: 12px; letter-spacing: .12em; color: var(--ink); }
  .lbl .ru { font-size: 9.5px; letter-spacing: .06em; color: var(--dim); margin-top: 1px; }
  .lbl.base .en { color: #fff; }
  .lbl .pin { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 5px; box-shadow: 0 0 6px currentColor; vertical-align: baseline; }

  #banner {
    top: 74px; left: 50%; transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: .18em;
    font-size: 14px; padding: 6px 16px; opacity: 0; transition: opacity .4s;
    border-top: 1px solid var(--panel-edge); border-bottom: 1px solid var(--panel-edge);
    background: var(--panel);
  }
  #banner.show { opacity: 1; }

  /* подписи ключевых точек */
  #kplabels { position: fixed; inset: 0; z-index: 11; pointer-events: none; overflow: hidden; }
  .kplbl {
    position: absolute; transform: translate(-50%, -140%);
    font-family: 'Share Tech Mono', monospace; font-size: 10px; white-space: nowrap;
    color: var(--ink); letter-spacing: .04em; text-shadow: 0 1px 4px #000, 0 0 2px #000;
    will-change: transform, opacity;
  }
  .kplbl.anom { color: #cdd6b0; }
  .kplbl .d { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 4px; box-shadow: 0 0 6px currentColor; }

  /* инфо-панель точки */
  #kpInfo {
    bottom: 46px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--geiger);
    padding: 8px 16px 9px; text-align: center; min-width: 190px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #kpInfo.show { opacity: 1; }
  #kpInfo b { display: block; font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  #kpInfo span { display: block; font-family: 'Share Tech Mono', monospace; font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  #kpInfo em { display: block; font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--geiger); font-style: normal; letter-spacing: .08em; margin-top: 5px; }

  @media (max-width: 640px) {
    #brand .panel { min-width: 0; }
    #brand h1 { font-size: 18px; letter-spacing: .22em; }
    #factions .panel { width: 200px; }
    #tele { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="kplabels"></div>
<div id="kpInfo" class="hud"></div>

<div id="banner" class="hud"></div>

<div id="brand" class="hud">
  <div class="panel corner">
    <h1>ЗОНА</h1>
    <div class="sub">CHERNOBYL EXCLUSION · FACTION WAR</div>
    <div class="sector" id="sectorTxt">СЕКТОР: —</div>
  </div>
</div>

<div id="tele" class="hud">
  <div class="panel corner">
    <div class="readout"><span class="k">ВРЕМЯ</span><span class="v" id="clock">--:--</span></div>
    <div class="readout"><span class="k">ПОГОДА</span><span class="v" id="wx">—</span></div>
    <div class="readout"><span class="k">ФОН</span><span class="v" id="rad">0.00 μSv</span></div>
    <div class="readout"><span class="k">ТОЧКИ</span><span class="v" id="resPt">—</span></div>
    <div class="readout"><span class="k">АНОМАЛИИ</span><span class="v" id="resAnom">—</span></div>
    <button id="weatherBtn">СМЕНИТЬ ПОГОДУ</button>
  </div>
</div>

<div id="factions" class="hud">
  <div class="panel corner">
    <div class="head">ВЫБЕРИ ГРУППИРОВКУ</div>
    <div id="facList"></div>
  </div>
</div>

<div id="hint" class="hud">
  <b>колесо</b> — зум · <b>ЛКМ</b> — перемещение · <b>ПКМ</b> — поворот
</div>

<div id="boot">
  <div class="rad"></div>
  <div>ЗАГРУЗКА ЗОНЫ</div>
  <small id="bootMsg">инициализация вокселей…</small>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';

/* ============================================================
   ЗОНА — воксельная карта. Milestone 1.
   Слои: террейн (instanced), здания-LEGO (instanced, растут при зуме),
   маяки баз, погода (день/ночь + дождь/туман), HUD-подписи.
   ============================================================ */

const GX = 288, GZ = 640;              // карта ×3 — регионам есть где дышать
const TILE = 1;                        // размер вокселя
const HALF_X = (GX * TILE) / 2;
const HALF_Z = (GZ * TILE) / 2;

/* ---- группировки STALKER ---- */
const FACTIONS = {
  loners:   { name: 'Одиночки', color: 0xc9a35a },
  duty:     { name: 'Долг',     color: 0xb23b3b },
  freedom:  { name: 'Свобода',  color: 0x54a24a },
  bandits:  { name: 'Бандиты',  color: 0x9a8730 },
  mercs:    { name: 'Наёмники', color: 0x3f78c0 },
  military: { name: 'Военные',  color: 0x6f7d45 },
  monolith: { name: 'Монолит',  color: 0x46c7d6 },
  eco:      { name: 'Учёные',   color: 0xd98b2b },
  csky:     { name: 'Чистое небо', color: 0x86b8d6 },
};

/* ---- зоны карты: nx/nz — нормированные координаты (0..1) со скрина ---- */
const ZONES = [
  { en:'ZATON',         ru:'Затон',          nx:0.11, nz:0.10,  fac:'loners',  base:true,  biome:'swamp' },
  { en:'KURCHATOV-37',  ru:'Курчатов-37',    nx:0.90, nz:0.065, fac:'military', base:false, biome:'city' },
  { en:'JUPITER',       ru:'Юпитер',         nx:0.07, nz:0.155, fac:'mercs',    base:false, biome:'waste' },
  { en:'PRIPYAT',       ru:'Припять',        nx:0.40, nz:0.150, fac:'monolith', base:false, biome:'city' },
  { en:'GENERATORS',    ru:'Генераторы',     nx:0.75, nz:0.170, fac:'monolith', base:false, biome:'city' },
  { en:'C.N.P.P',       ru:'ЧАЭС',           nx:0.78, nz:0.262, fac:'monolith', base:true,  biome:'waste' },
  { en:'RED FOREST',    ru:'Рыжий лес',      nx:0.32, nz:0.292, fac:'monolith', base:false, anomaly:true, biome:'deadforest' },
  { en:'LABYRINTH',     ru:'Лабиринт',       nx:0.60, nz:0.312, fac:'neutral',  base:false, biome:'rocky' },
  { en:'LIMANSK-13',    ru:'Лиманск-13',     nx:0.05, nz:0.320, fac:'monolith', base:false, biome:'city' },
  { en:'RADAR',         ru:'Радар',          nx:0.38, nz:0.372, fac:'monolith', base:true,  anomaly:true, biome:'swamp' },
  { en:'DEAD CITY',     ru:'Мёртвый город',  nx:0.10, nz:0.400, fac:'mercs',    base:true,  biome:'city' },
  { en:'DEADLANDS',     ru:'Пустошь',        nx:0.47, nz:0.440, fac:'neutral',  base:false, biome:'waste' },
  { en:'CROSSROADS',    ru:'Перекрёсток',    nx:0.30, nz:0.548, fac:'neutral',  base:false, biome:'forest' },
  { en:'ARMY WAREHOUSES',ru:'Военные склады',nx:0.65, nz:0.548, fac:'freedom',  base:true,  biome:'forest' },
  { en:'MARSH',         ru:'Топи',           nx:0.10, nz:0.580, fac:'csky',     base:true,  biome:'swamp' },
  { en:'YANTAR',        ru:'Янтарь',         nx:0.36, nz:0.632, fac:'eco',      base:true,  anomaly:true, biome:'swamp' },
  { en:'ROSTOK',        ru:'Росток',         nx:0.55, nz:0.620, fac:'duty',     base:true,  biome:'city' },
  { en:'ZAPOLYE',       ru:'Заполье',        nx:0.85, nz:0.652, fac:'neutral',  base:false, biome:'waste' },
  { en:'FACTORY',       ru:'Завод',          nx:0.08, nz:0.680, fac:'bandits',  base:false, biome:'waste' },
  { en:'DARK VALLEY',   ru:'Тёмная долина',  nx:0.82, nz:0.752, fac:'bandits',  base:true,  biome:'rocky' },
  { en:'AGROPROM',      ru:'Агропром',       nx:0.35, nz:0.792, fac:'military', base:true,  biome:'waste' },
  { en:'GARBAGE',       ru:'Свалка',         nx:0.55, nz:0.782, fac:'loners',   base:false, biome:'waste' },
  { en:'WAYSTATION',    ru:'Станция',        nx:0.75, nz:0.820, fac:'neutral',  base:false, biome:'forest' },
  { en:'CORDON',        ru:'Кордон',         nx:0.52, nz:0.900, fac:'loners',   base:true,  biome:'forest' },
  { en:'GREAT SWAMP',   ru:'Болота',         nx:0.25, nz:0.920, fac:'csky',     base:false, biome:'swamp' },
  { en:'DARKSCAPE',     ru:'Тёмная лощина',  nx:0.82, nz:0.920, fac:'neutral',  base:false, biome:'rocky' },
];

// перевод нормированных координат в мир
function zoneWorld(z) {
  return { x: (z.nx - 0.5) * GX * TILE, z: (z.nz - 0.5) * GZ * TILE };
}
ZONES.forEach((z, i) => { const w = zoneWorld(z); z.wx = w.x; z.wz = w.z; z.idx = i; });

/* ---- детерминированный шум ---- */
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct = 4) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * valueNoise(x * freq, y * freq);
    norm += amp; amp *= 0.5; freq *= 2;
  }
  return sum / norm;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- вода: река Припять (широкая, с изгибами) + болота + озёра ---- */
function waterLevelAt(gx, gz) {
  const nx = gx / GX, nz = gz / GZ;

  // Река Припять — широкая, течёт с севера на юг по правой части карты
  const riverX = 0.72 + 0.06 * Math.sin(gz * 0.022) + 0.03 * Math.sin(gz * 0.051);
  const riverW = 0.038 + 0.012 * valueNoise(gz * 0.04, 11.3);
  if (Math.abs(nx - riverX) < riverW) return true;

  // Охладительный пруд ЧАЭС (большое прямоугольное озеро)
  if (nx > 0.76 && nx < 0.95 && nz > 0.18 && nz < 0.32) return true;

  // Болото Затона (север-запад) — неровное пятно
  const zatonBogX = 0.11, zatonBogZ = 0.10;
  const dZaton = Math.hypot((nx - zatonBogX) * 2.2, nz - zatonBogZ);
  if (dZaton < 0.038 + 0.015 * valueNoise(gx * 0.08, gz * 0.08)) return true;

  // Болото Великих Топей (запад, середина)
  const marshX = 0.10, marshZ = 0.58;
  if (Math.hypot((nx - marshX) * 1.6, nz - marshZ) < 0.042 + 0.018 * valueNoise(gx * 0.07, gz * 0.07 + 5)) return true;

  // Янтарь — аномальное болото
  const yanX = 0.36, yanZ = 0.63;
  if (Math.hypot((nx - yanX) * 1.4, nz - yanZ) < 0.028 + 0.01 * valueNoise(gx * 0.1, gz * 0.1 + 9)) return true;

  // мелкие лужи и пруды (процедурно)
  if (valueNoise(gx * 0.06 + 3.1, gz * 0.06 + 3.1) > 0.83 && valueNoise(gx * 0.12, gz * 0.12) > 0.72) return true;

  return false;
}

/* ---- маска биомов по региону: каждая локация STALKER имеет свой ландшафт ---- */
// предвычисляем Voronoi-подобную маску: для каждого тайла ближайшая зона и расстояние до неё
// используем BIOME_COL и уникальные параметры рельефа per-биом
const BIOME_HEIGHT = {
  forest:     { scale: 6.0,  flat: 0.35, detail: 0.22 },  // пологий лес
  swamp:      { scale: 2.5,  flat: 0.65, detail: 0.12 },  // почти плоское болото
  city:       { scale: 3.5,  flat: 0.50, detail: 0.15 },  // городская застройка
  waste:      { scale: 8.0,  flat: 0.20, detail: 0.30 },  // изрытая пустошь
  rocky:      { scale: 11.0, flat: 0.10, detail: 0.40 },  // скалы
  deadforest: { scale: 5.0,  flat: 0.30, detail: 0.25 },  // мёртвый лес
};

/* ============================================================
   СЦЕНА
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a3327, 0.006);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 1, 6000);
camera.position.set(0, 700, 700);

const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 20;
controls.maxDistance = 1100;
controls.minPolarAngle = THREE.MathUtils.degToRad(30);
controls.maxPolarAngle = THREE.MathUtils.degToRad(62);
controls.target.set(0, 0, 0);

// мягкое ограничение панорамы границами карты
function clampToMap() {
  const cx = THREE.MathUtils.clamp(controls.target.x, -HALF_X * 1.05, HALF_X * 1.05);
  const cz = THREE.MathUtils.clamp(controls.target.z, -HALF_Z * 1.05, HALF_Z * 1.05);
  const dx = cx - controls.target.x, dz = cz - controls.target.z;
  if (dx || dz) {
    controls.target.x = cx; controls.target.z = cz;
    camera.position.x += dx; camera.position.z += dz;
  }
}

/* ---- свет ---- */
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x2a2318, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d0, 1.6);
sun.position.set(120, 200, 60);
scene.add(sun);
const ambient = new THREE.AmbientLight(0x30392b, 0.5);
scene.add(ambient);

/* ============================================================
   ТЕРРЕЙН (instanced voxels)
   ============================================================ */
const HEIGHT_SCALE = 8.0;
const BASE_H = 1.2;

// цветовые палитры биомов
const C = {
  forestA: new THREE.Color(0x3d5233), forestB: new THREE.Color(0x2c3d26),
  meadow:  new THREE.Color(0x4a5e30), meadowB: new THREE.Color(0x3a4e24),
  waste:   new THREE.Color(0x6b5f3f), wasteB:  new THREE.Color(0x574b32),
  swamp:   new THREE.Color(0x394a34), swampB:  new THREE.Color(0x283529),

// ближайшая зона к тайлу (для окраски регионов)
function nearestZone(wx, wz) {
  let best = null, bd = Infinity;
  for (const z of ZONES) {
    const d = (z.wx - wx) ** 2 + (z.wz - wz) ** 2;
    if (d < bd) { bd = d; best = z; }
  }
  return { z: best, dist: Math.sqrt(bd) };
}

}

// процедурная генерация точек для остальных регионов (детерминированно, per-zone seed)
function genKeypoints(z, zi) {
  const rnd = mulberry32(5000 + zi * 131);
  const used = new Set();
  const pts = [];
  const R = 9 + rnd() * 3;
  const place = () => {
    for (let tries = 0; tries < 12; tries++) {
      const ang = rnd() * Math.PI * 2, rr = 2 + rnd() * R;
      const dx = Math.cos(ang) * rr, dz = Math.sin(ang) * rr * 0.75;
      let ok = true;
      for (const p of pts) if (Math.hypot(p.dx - dx, p.dz - dz) < 3.2) { ok = false; break; }
      if (ok) return { dx, dz };
    }
    return { dx: (rnd() - 0.5) * R * 2, dz: (rnd() - 0.5) * R * 1.4 };
  };

  if (z.base) {
    const p = place();
    pts.push({ ru: pickName(rnd, NAME_POOL.base, used), dx: p.dx, dz: p.dz, type: 'base', owner: z.fac });
  }
  const anomCount = z.anomaly ? 2 + Math.floor(rnd() * 2) : (rnd() < 0.5 ? 1 : 0);
  for (let i = 0; i < anomCount; i++) {
    const kind = ANOM_KEYS[Math.floor(rnd() * ANOM_KEYS.length)];
    const p = place();
    pts.push({ ru: pickName(rnd, NAME_POOL.anomaly[kind], used), dx: p.dx, dz: p.dz, type: 'anomaly', owner: 'neutral', kind });
  }
  const settleCount = 2 + Math.floor(rnd() * 3);
  for (let i = 0; i < settleCount; i++) {
    const p = place();
    const owner = (z.fac !== 'neutral' && rnd() < 0.25) ? z.fac : 'neutral';
    pts.push({ ru: pickName(rnd, NAME_POOL.settlement, used), dx: p.dx, dz: p.dz, type: 'settlement', owner });
  }
  if (rnd() < 0.6) {
    const p = place();
    pts.push({ ru: pickName(rnd, NAME_POOL.chokepoint, used), dx: p.dx, dz: p.dz, type: 'chokepoint', owner: 'neutral' });
  }
  return pts;
}

const KEYPOINTS = [];
const kpByZone = [];
for (let zi = 0; zi < ZONES.length; zi++) {
  const z = ZONES[zi];
  // ВРЕМЕННО: точки есть только у Затона (эталон). Остальные регионы
  // трогать не будем, пока не появятся реальные карты с локации STALKER —
  // генерировать точки случайными именами по региону нельзя.
  const raw = z.en === 'ZATON' ? ZATON_KP : [];
  const list = raw.map(k => ({ ...k, r: z.en, zi, wx: z.wx + k.dx, wz: z.wz + k.dz }));
  kpByZone[zi] = list;
  KEYPOINTS.push(...list);
}
function kpColor(k) { return k.owner === 'neutral' ? 0xbfc4b8 : FACTIONS[k.owner].color; }

// Затон: воду теперь делает общая waterLevelAt с болотом Затона
const ZATON_IDX = ZONES.findIndex(z => z.en === 'ZATON');

let idx = 0;
for (let gz = 0; gz < GZ; gz++) {
  for (let gx = 0; gx < GX; gx++) {
    const wx = (gx - GX / 2 + 0.5) * TILE;
    const wz = (gz - GZ / 2 + 0.5) * TILE;
    const nx = gx / GX, nz = gz / GZ;

    // крупные и мелкие формы рельефа
    const eBase = fbm(gx * 0.010 + 10, gz * 0.010 + 10, 4); // крупные хребты
    const eMid  = fbm(gx * 0.035 - 5,  gz * 0.035 - 5,  4); // средние холмы
    const eFine = fbm(gx * 0.095 + 3,  gz * 0.095 + 3,  3); // мелкие детали
    const m     = fbm(gx * 0.018 - 20, gz * 0.018 - 20, 3); // влажность

    const near = nearestZone(wx, wz);
    const biome = near.z.biome || 'forest';
    const bh = BIOME_HEIGHT[biome] || BIOME_HEIGHT.forest;

    // per-биом мешаем слои по-разному
    const e = eBase * (1 - bh.flat) * 0.55
            + eMid  * (1 - bh.flat) * 0.30
            + eFine * bh.detail;

    const isWater = waterLevelAt(gx, gz);
    const cityInfluence = Math.max(0, 1 - near.dist / 12);
    const biomeInfl = Math.max(0, 1 - near.dist / 28);

    let h, base, edge, t;
    if (isWater) {
      h = 0.5; base = C.water; edge = C.waterB; t = e;
    } else if (cityInfluence > 0.12 && near.z.fac !== 'neutral') {
      h = BASE_H + e * 3.5; base = C.city; edge = C.cityB; t = m;
    } else if (biome === 'swamp' || (m > 0.64 && e < 0.5)) {
      h = BASE_H + e * bh.scale * 0.4;
      base = C.swamp; edge = C.swampB; t = m;
    } else if (biome === 'rocky') {
      h = BASE_H + e * bh.scale;
      base = e > 0.65 ? C.rock : C.waste; edge = C.rockB; t = e;
    } else if (biome === 'deadforest') {
      h = BASE_H + e * bh.scale;
      base = C.deadA; edge = C.deadB; t = e;
    } else if (biome === 'waste' || m < 0.38) {
      h = BASE_H + e * bh.scale;
      base = e > 0.55 ? C.sand : C.waste; edge = C.wasteB; t = e;
    } else {
      h = BASE_H + e * bh.scale;
      base = e > 0.58 ? C.meadow : C.forestA; edge = C.forestB; t = e;
    }

    // скалистые вершины
    if (!isWater && e > 0.72 && biome !== 'swamp' && biome !== 'city')
      base = base.clone().lerp(C.rock, (e - 0.72) / 0.28 * 0.6);

    // биомный модификатор высоты
    if (!isWater) {
      if (biome === 'rocky')      h *= 1 + biomeInfl * 0.6;
      else if (biome === 'swamp') h = Math.min(h, BASE_H + 1.5 * biomeInfl + (1 - biomeInfl) * h);
      else if (biome === 'waste') h *= 1 + biomeInfl * 0.25;
    }

    col.copy(edge).lerp(base, smooth(t));
    col.offsetHSL(0, 0, (hash2(gx, gz) - 0.5) * 0.055); // пёстрость

    // ---- аномальные воронки (на уровне тайлов: тёмный кратер + ореол) ----
    for (const z of ZONES) {
      if (!z.anomaly) continue;
      const d = Math.hypot(z.wx - wx, z.wz - wz);
      const R = 22;
      if (d < R) {
        const t2 = 1 - d / R;
        col.lerp(C.anomaly, t2 * t2 * 0.55);
        if (d < 8) h *= 1 - (1 - d / 8) * 0.45; // воронка-кратер
      }
    }

    // ---- пиксельные пятна вокруг ключевых точек ----
    const zoneKps = kpByZone[near.z.idx];
    if (zoneKps) {
      for (const k of zoneKps) {
        const d = Math.hypot(k.wx - wx, k.wz - wz);
        if (k.type === 'anomaly') {
          if (d < 6) col.lerp(new THREE.Color(ANOM[k.kind].color), (1 - d / 6) * 0.48);
        } else if (d < 4.5) {
          col.lerp(new THREE.Color(0x8a7a58), (1 - d / 4.5) * 0.30);
        }
      }
    }

    // ---- характер региона (цвет) ----
    if (!isWater) {
      const bc = BIOME_COL[biome];
      if (bc) col.lerp(bc, biomeInfl * 0.48);
    }

    // ---- просека/дорога между зонами (светлая полоска) ----
    // ищем вторую ближайшую зону
    let best2d = Infinity, best2 = null;
    for (const z of ZONES) {
      const d = (z.wx - wx) ** 2 + (z.wz - wz) ** 2;
      if (d < (near.z.wx - wx) ** 2 + (near.z.wz - wz) ** 2 + 0.01) continue;
      if (d < best2d) { best2d = d; best2 = z; }
    }
    if (best2) {
      const d1 = Math.hypot(near.z.wx - wx, near.z.wz - wz);
      const d2 = Math.hypot(best2.wx - wx, best2.wz - wz);
      const edge2 = d1 + d2;
      // чем ближе к линии Вороного — тем больше шанс быть дорогой
      const roadT = Math.max(0, 1 - Math.abs(d1 - d2) / 3.5) * Math.max(0, 1 - edge2 / 90);
      if (roadT > 0.7 && !isWater) {
        col.lerp(new THREE.Color(0x6b6050), roadT * 0.38);
        h *= 1 - roadT * 0.12;
      }
    }

    h = Math.max(0.5, h);
    topAt[idx] = h;
    dummy.position.set(wx, h / 2, wz);
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    ground.setMatrixAt(idx, dummy.matrix);
    ground.setColorAt(idx, col);
    idx++;
  }
}
ground.instanceMatrix.needsUpdate = true;
ground.instanceColor.needsUpdate = true;

function topAtWorld(wx, wz) {
  const gx = Math.round(wx / TILE + GX / 2 - 0.5);
  const gz = Math.round(wz / TILE + GZ / 2 - 0.5);
  if (gx < 0 || gx >= GX || gz < 0 || gz >= GZ) return BASE_H;
  return topAt[gz * GX + gx];
}
KEYPOINTS.forEach(k => { k.gTop = topAtWorld(k.wx, k.wz); });

/* ============================================================
   ЗДАНИЯ-LEGO (instanced, растут снизу вверх при зуме)
   ============================================================ */
const voxGeo = new THREE.BoxGeometry(0.96, 1, 0.96);
const voxMat = new THREE.MeshLambertMaterial();
const buildingVox = [];   // {x,z,layer,ground,color, sx,sz}

let curPivotX = 0, curPivotZ = 0;   // «якорь» текущей постройки — вокруг него она сжимается при зуме
function pushVox(wx, wz, layer, gTop, color, zi) {
  buildingVox.push({ x: wx, z: wz, layer, ground: gTop, color, zone: zi, pcx: curPivotX, pcz: curPivotZ });
}
function tint(hex, rnd) {
  return new THREE.Color(hex).offsetHSL(0, 0, (rnd() - 0.5) * 0.06);
}
// заполнить прямоугольный блок вокселей (с опциями окон/руин/оболочки)
function fillBox(z, zi, gTop, cx, cz, w, d, h, colorFn, rnd, opts = {}) {
  for (let x = 0; x < w; x++)
    for (let zz = 0; zz < d; zz++)
      for (let ly = 0; ly < h; ly++) {
        if (opts.shell && x > 0 && x < w - 1 && zz > 0 && zz < d - 1 && ly < h - 1) continue;
        if (opts.ruin && rnd() < opts.ruin * (ly / h)) continue;   // выщербленный верх
        let c = colorFn(ly);
        if (opts.windows && rnd() < 0.14) c = c.multiplyScalar(0.5);
        pushVox(cx + x - (w - 1) / 2, cz + zz - (d - 1) / 2, ly, gTop, c, zi);
      }
}
const CONCRETE = [0x8d8f86, 0x9a9c92, 0x76786f, 0x6a6d64];

/* ---- архетипы лэндмарков ---- */
// Радар — антенна «Дуга» (гигантская решётчатая стена)
function archDuga(z, zi, gTop, rnd) {
  const W = 18, H = 12, metal = () => tint(0x6b7075, rnd);
  for (let x = 0; x < W; x++)
    for (let ly = 0; ly < H; ly++) {
      if (x % 2 === 0 || ly % 3 === 0 || (x + ly) % 4 === 0) {
        pushVox(z.wx + x - W / 2, z.wz, ly, gTop, metal(), zi);
        pushVox(z.wx + x - W / 2, z.wz + 1, ly, gTop, metal(), zi);
      }
    }
  for (let i = 0; i <= 3; i++) {
    const px = z.wx - W / 2 + i * (W / 3);
    for (let ly = 0; ly < 3; ly++) pushVox(px, z.wz - 2, ly, gTop, tint(0x55585a, rnd), zi);
  }
}
// Припять — колесо обозрения
function archFerris(z, zi, gTop, rnd) {
  const R = 5, hub = R + 1, yellow = () => tint(0x9a8a3a, rnd);
  for (let a = 0; a < 44; a++) {
    const ang = a / 44 * Math.PI * 2;
    const x = Math.round(Math.cos(ang) * R), y = Math.round(Math.sin(ang) * R) + hub;
    if (y >= 0) pushVox(z.wx + x, z.wz, y, gTop, yellow(), zi);
  }
  for (let s = 0; s < 8; s++) {
    const ang = s / 8 * Math.PI * 2;
    for (let r = 2; r < R; r += 2) {
      const x = Math.round(Math.cos(ang) * r), y = Math.round(Math.sin(ang) * r) + hub;
      if (y >= 0) pushVox(z.wx + x, z.wz, y, gTop, yellow(), zi);
    }
  }
  pushVox(z.wx, z.wz, hub, gTop, tint(0x777, rnd), zi);
  for (let ly = 0; ly <= hub; ly++) {
    const sp = Math.round((1 - ly / hub) * 4);
    pushVox(z.wx - sp, z.wz + 1, ly, gTop, tint(0x6a6a5a, rnd), zi);
    pushVox(z.wx + sp, z.wz + 1, ly, gTop, tint(0x6a6a5a, rnd), zi);
  }
  archRuins(z, zi, gTop, rnd, null, 3);   // немного руин рядом
}
// Росток/Завод/Юпитер — цеха с трубами (варьируются)
function archFactory(z, zi, gTop, rnd, faccol) {
  const base = faccol || new THREE.Color(0x808080);
  const grey = () => tint(0x83857c, rnd).lerp(base, 0.12);
  const brick = () => tint(0x7a5a4a, rnd);
  const hw = 6 + Math.floor(rnd() * 3), hd = 4 + Math.floor(rnd() * 2);
  fillBox(z, zi, gTop, z.wx, z.wz, hw, hd, 3, grey, rnd, { windows: true });
  // пристройка со случайным смещением
  const ax = (rnd() < 0.5 ? -1 : 1) * (2 + Math.floor(rnd() * 2));
  fillBox(z, zi, gTop, z.wx + ax, z.wz + (rnd() < 0.5 ? 3 : -3),
    3 + Math.floor(rnd() * 2), 3, 2 + Math.floor(rnd() * 2), grey, rnd, { windows: true });
  // 1..3 трубы разной высоты в разных местах
  const chimneys = 1 + Math.floor(rnd() * 3);
  for (let i = 0; i < chimneys; i++) {
    const cx = z.wx - Math.floor(hw / 2) + Math.floor(rnd() * hw);
    const cz = z.wz - Math.floor(hd / 2) - 1 - Math.floor(rnd() * 2);
    const ch = 7 + Math.floor(rnd() * 4);
    for (let ly = 0; ly < ch; ly++) pushVox(cx, cz, ly, gTop, brick(), zi);
  }
  // иногда — градирня
  if (rnd() < 0.5) {
    const gx = z.wx + Math.floor(hw / 2) + 1, gz = z.wz - 2;
    for (let ly = 0; ly < 6; ly++) {
      const r = ly < 4 ? 2 : 1;
      for (let x = -r; x <= r; x++)
        for (let zz = -r; zz <= r; zz++)
          if (Math.abs(x) === r || Math.abs(zz) === r || ly === 5)
            pushVox(gx + x, gz + zz, ly, gTop, tint(0x8b8d84, rnd), zi);
    }
  }
}
// Тёмная долина — бандитская база: забор, барак, дом, вышка
function archCompound(z, zi, gTop, rnd, faccol) {
  const base = faccol || new THREE.Color(0x808080);
  const wall = () => tint(0x6a5a44, rnd);
  const wood = () => tint(0x6b5236, rnd).lerp(base, 0.1);
  const R = 6;
  for (let x = -R; x <= R; x++) { pushVox(z.wx + x, z.wz - R, 0, gTop, wall(), zi); pushVox(z.wx + x, z.wz + R, 0, gTop, wall(), zi); }
  for (let zz = -R; zz <= R; zz++) { pushVox(z.wx - R, z.wz + zz, 0, gTop, wall(), zi); pushVox(z.wx + R, z.wz + zz, 0, gTop, wall(), zi); }
  fillBox(z, zi, gTop, z.wx - 2, z.wz, 4, 3, 2, wood, rnd, {});
  for (let x = 0; x < 4; x++) pushVox(z.wx - 2 + x - 1.5, z.wz, 2, gTop, tint(0x7a4a34, rnd), zi);
  fillBox(z, zi, gTop, z.wx + 2, z.wz - 2, 3, 3, 3, wood, rnd, { windows: true });
  for (let ly = 0; ly < 5; ly++) pushVox(z.wx - R + 1, z.wz + R - 1, ly, gTop, tint(0x5c4a34, rnd), zi);
  fillBox(z, zi, gTop, z.wx - R + 1, z.wz + R - 1, 2, 2, 1, wood, rnd, {});
}
// Затон — севший на мель корабль «Скадовск»
function archShip(z, zi, gTop, rnd) {
  const rust = () => tint(0x7a4e34, rnd), L = 10, Wd = 4;
  for (let x = 0; x < L; x++) {
    const taper = Math.min(x, L - 1 - x), w = Math.min(Wd, 1 + taper);
    for (let zz = -w; zz <= w; zz++)
      for (let ly = 0; ly < 3; ly++) {
        if (ly === 0 && Math.abs(zz) === w) continue;
        pushVox(z.wx + x - L / 2, z.wz + zz, ly, gTop, rust(), zi);
      }
  }
  fillBox(z, zi, gTop, z.wx + 1, z.wz, 3, 3, 3, () => tint(0x9a9c92, rnd), rnd, { windows: true });
  for (let ly = 3; ly < 9; ly++) pushVox(z.wx + 1, z.wz, ly + 3, gTop, tint(0x6a6f73, rnd), zi);
}
// Агропром — институт
function archInstitute(z, zi, gTop, rnd, faccol) {
  const c = () => tint(0x8a8c82, rnd).lerp(faccol || new THREE.Color(0x808080), 0.1);
  fillBox(z, zi, gTop, z.wx, z.wz, 7, 4, 4, c, rnd, { windows: true });
  fillBox(z, zi, gTop, z.wx, z.wz - 3, 7, 2, 3, c, rnd, { windows: true });
  fillBox(z, zi, gTop, z.wx - 4, z.wz, 2, 4, 5, c, rnd, { windows: true });
  for (let ly = 0; ly < 10; ly++) pushVox(z.wx + 4, z.wz - 3, ly, gTop, tint(0x7a5a4a, rnd), zi);
}
// Янтарь — бункер учёных с антенной-тарелкой
function archBunker(z, zi, gTop, rnd, faccol) {
  const c = () => tint(0x77796f, rnd).lerp(faccol || new THREE.Color(0x808080), 0.12);
  fillBox(z, zi, gTop, z.wx, z.wz, 6, 5, 2, c, rnd, {});
  fillBox(z, zi, gTop, z.wx + 1, z.wz, 3, 3, 3, c, rnd, { windows: true });
  for (let ly = 0; ly < 7; ly++) pushVox(z.wx - 2, z.wz + 1, ly, gTop, tint(0x6a6f73, rnd), zi);
  for (let a = 0; a < 10; a++) {
    const ang = a / 10 * Math.PI * 2;
    pushVox(z.wx - 2 + Math.round(Math.cos(ang) * 2), z.wz + 1 + Math.round(Math.sin(ang)), 7, gTop, tint(0xb0b2a8, rnd), zi);
  }
}
// Военные склады — ряды ангаров + вышка
function archWarehouses(z, zi, gTop, rnd, faccol) {
  const c = () => tint(0x7c7e74, rnd).lerp(faccol || new THREE.Color(0x808080), 0.14);
  for (let i = 0; i < 3; i++) {
    fillBox(z, zi, gTop, z.wx, z.wz - 4 + i * 4, 8, 3, 2, c, rnd, {});
    for (let x = 0; x < 8; x++) pushVox(z.wx + x - 3.5, z.wz - 4 + i * 4, 2, gTop, c(), zi);
  }
  for (let ly = 0; ly < 6; ly++) pushVox(z.wx - 5, z.wz + 4, ly, gTop, tint(0x6b5236, rnd), zi);
  fillBox(z, zi, gTop, z.wx - 5, z.wz + 4, 2, 2, 1, () => tint(0x6b5236, rnd), rnd, {});
}
// военный блокпост
function archMilitary(z, zi, gTop, rnd, faccol) {
  const c = () => tint(0x6f7245, rnd).lerp(faccol || new THREE.Color(0x808080), 0.2);
  fillBox(z, zi, gTop, z.wx, z.wz, 4, 3, 2, c, rnd, {});
  fillBox(z, zi, gTop, z.wx + 3, z.wz + 2, 3, 2, 2, c, rnd, {});
  for (let ly = 0; ly < 5; ly++) pushVox(z.wx - 3, z.wz - 2, ly, gTop, tint(0x5c5e40, rnd), zi);
  fillBox(z, zi, gTop, z.wx - 3, z.wz - 2, 2, 2, 1, c, rnd, {});
  for (let x = -4; x <= 4; x++) pushVox(z.wx + x, z.wz - 3, 0, gTop, tint(0x7a6a4a, rnd), zi);
}
// Свалка — кран, штабели контейнеров, металлолом
function archJunkyard(z, zi, gTop, rnd) {
  const cx = z.wx - 4, cz = z.wz + 2, crane = () => tint(0x9a7a2a, rnd);
  for (let ly = 0; ly < 10; ly++) pushVox(cx, cz, ly, gTop, crane(), zi);      // мачта
  for (let x = 1; x <= 7; x++) pushVox(cx + x, cz, 9, gTop, crane(), zi);       // стрела
  pushVox(cx + 7, cz, 8, gTop, tint(0x555555, rnd), zi);                        // трос
  pushVox(cx + 7, cz, 6, gTop, tint(0x8a3a30, rnd), zi);                        // подвешенный кузов
  const cont = [0x9a4030, 0x2f6a5a, 0xb0902e, 0x3a5a7a, 0x7a4e34];
  for (let r = 0; r < 3; r++)
    for (let cN = 0; cN < 3; cN++) {
      if (rnd() < 0.25) continue;
      const bx = z.wx + cN * 2, bz = z.wz - 2 + r * 2, stack = 1 + Math.floor(rnd() * 2);
      for (let s = 0; s < stack; s++) {
        const c = tint(cont[Math.floor(rnd() * cont.length)], rnd);
        for (let ax = 0; ax < 2; ax++) for (let az = 0; az < 2; az++)
          pushVox(bx + ax, bz + az, s, gTop, c, zi);
      }
    }
  const scrap = [0x6a5a4a, 0x7a4e34, 0x555a5a];
  for (let i = 0; i < 8; i++) {
    const ox = Math.round((rnd() - 0.5) * 6), oz = Math.round((rnd() - 0.5) * 6);
    pushVox(z.wx + ox, z.wz + oz + 3, 0, gTop, tint(scrap[Math.floor(rnd() * 3)], rnd), zi);
  }
}
// деревня — избы с крышами
function archVillage(z, zi, gTop, rnd) {
  const n = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const ox = Math.round((rnd() - 0.5) * 9), oz = Math.round((rnd() - 0.5) * 9);
    const w = 2, d = 2, h = 1 + Math.floor(rnd() * 2);
    const wood = [0x6b5236, 0x74553a, 0x5f4a30];
    fillBox(z, zi, gTop, z.wx + ox, z.wz + oz, w, d, h, () => tint(wood[Math.floor(rnd() * 3)], rnd), rnd, {});
    for (let x = 0; x < w; x++)
      for (let zz = 0; zz < d; zz++)
        pushVox(z.wx + ox + x - (w - 1) / 2, z.wz + oz + zz - (d - 1) / 2, h, gTop, tint(0x7a4a34, rnd), zi);
    pushVox(z.wx + ox, z.wz + oz, h + 1, gTop, tint(0x7a4a34, rnd), zi);
  }
}
// руины — битый бетон с проломами
function archRuins(z, zi, gTop, rnd, faccol, count) {
  const n = count || (3 + Math.floor(rnd() * 4));
  for (let i = 0; i < n; i++) {
    const ox = Math.round((rnd() - 0.5) * 9), oz = Math.round((rnd() - 0.5) * 9);
    const w = 2 + Math.floor(rnd() * 2), d = 2 + Math.floor(rnd() * 2), h = 2 + Math.floor(rnd() * 4);
    fillBox(z, zi, gTop, z.wx + ox, z.wz + oz, w, d, h,
      () => tint(CONCRETE[Math.floor(rnd() * CONCRETE.length)], rnd), rnd, { windows: true, ruin: 0.5 });
  }
}
// Рыжий лес — мёртвые деревья
function archDeadTrees(z, zi, gTop, rnd) {
  for (let i = 0; i < 20; i++) {
    const ox = Math.round((rnd() - 0.5) * 17), oz = Math.round((rnd() - 0.5) * 17);
    const h = 2 + Math.floor(rnd() * 4);
    for (let ly = 0; ly < h; ly++) pushVox(z.wx + ox, z.wz + oz, ly, gTop, tint(0x6a3a2a, rnd), zi);

// ЧАЭС — арка НБК + турбинный зал + вентиляционная труба
function buildCNPP(z, zi) {
  const gTop = topAtWorld(z.wx, z.wz);
  const silver = new THREE.Color(0xb9c1c7), hallC = new THREE.Color(0x86887f), cyan = new THREE.Color(FACTIONS.monolith.color);
  const R = 5, DEPTH = 3;
  for (let x = -R; x <= R; x++) {
    const top = Math.round(Math.sqrt(Math.max(0, R * R - x * x)) * 1.15);
    for (let zz = -DEPTH; zz <= DEPTH; zz++)
      for (let ly = 0; ly <= top; ly++) {
        const shell = (ly === top) || (x === -R || x === R) || (zz === -DEPTH || zz === DEPTH);
        if (!shell) continue;
        pushVox(z.wx + x, z.wz + zz, ly, gTop, silver.clone().lerp(cyan, 0.12).offsetHSL(0, 0, (Math.random() - 0.5) * 0.04), zi);
      }
  }
  for (let x = R + 1; x <= R + 7; x++)
    for (let zz = -2; zz <= 2; zz++)
      for (let ly = 0; ly < 3; ly++)
        pushVox(z.wx + x, z.wz + zz, ly, gTop, hallC.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.05), zi);
  for (let ly = 0; ly < 12; ly++) {
    const c = (Math.floor(ly / 2) % 2 === 0) ? new THREE.Color(0xcf4a3a) : new THREE.Color(0xe8e2d8);
    pushVox(z.wx + R + 6, z.wz - 1, ly, gTop, c, zi);
  }
}

function skyColor(t) {
  for (let i = 0; i < SKY.length - 1; i++) {
    if (t >= SKY[i].t && t <= SKY[i + 1].t) {
      const k = (t - SKY[i].t) / (SKY[i + 1].t - SKY[i].t);
      return SKY[i].c.clone().lerp(SKY[i + 1].c, k);
    }
  }
  return SKY[0].c.clone();
}

const facCount = {};
ZONES.forEach(z => { if (z.fac !== 'neutral') facCount[z.fac] = (facCount[z.fac] || 0) + 1; });

Object.entries(FACTIONS).forEach(([key, f]) => {
  if (!facCount[key]) return;
  const el = document.createElement('div');
  el.className = 'fac';
  el.innerHTML = `<span class="dot" style="background:#${f.color.toString(16).padStart(6,'0')};color:#${f.color.toString(16).padStart(6,'0')}"></span>
                  <span class="nm">${f.name}</span>
                  <span class="cnt">${facCount[key]} зон</span>`;
  el.addEventListener('click', () => selectFaction(key, el));
  facList.appendChild(el);
});

const banner = document.getElementById('banner');
function selectFaction(key, el) {
  myFaction = key;
  document.querySelectorAll('.fac').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  banner.textContent = `ТЫ ИГРАЕШЬ ЗА · ${FACTIONS[key].name.toUpperCase()}`;
  banner.style.color = `#${FACTIONS[key].color.toString(16).padStart(6,'0')}`;
  banner.classList.add('show');
  clearTimeout(selectFaction._t);
  selectFaction._t = setTimeout(() => banner.classList.remove('show'), 2600);
  updateResources();
}

/* ---- подписи зон (DOM-оверлей) ---- */
const labelsRoot = document.getElementById('labels');
const labelEls = ZONES.map(z => {
  const el = document.createElement('div');
  el.className = 'lbl' + (z.base ? ' base' : '');
  const c = z.fac === 'neutral' ? '#8a8c82' : '#' + FACTIONS[z.fac].color.toString(16).padStart(6, '0');
  el.innerHTML = `<div class="en"><span class="pin" style="background:${c};color:${c}"></span>${z.en}</div>
                  <div class="ru">${z.ru}</div>`;
  labelsRoot.appendChild(el);
  return el;
});

const clockEl = document.getElementById('clock');
const radEl = document.getElementById('rad');
const sectorEl = document.getElementById('sectorTxt');

/* ---- подписи ключевых точек ---- */
const kpLabelsRoot = document.getElementById('kplabels');
KEYPOINTS.forEach(k => {
  const el = document.createElement('div');
  el.className = 'kplbl' + (k.type === 'anomaly' ? ' anom' : '');
  const c = k.type === 'anomaly' ? ANOM[k.kind].color : kpColor(k);
  el.innerHTML = `<span class="d" style="background:#${c.toString(16).padStart(6, '0')}"></span>${k.ru}`;
  kpLabelsRoot.appendChild(el);
  k.labelEl = el;
});

/* ---- клик = захват точки ---- */
const kpInfo = document.getElementById('kpInfo');
function showKPInfo(k) {
  const owner = k.owner === 'neutral' ? 'нейтрально' : FACTIONS[k.owner].name;
  const typ = k.type === 'anomaly' ? `аномалия «${ANOM[k.kind].name}» · ресурс` : KP_TYPE[k.type];
  const hint = !myFaction ? 'выбери группировку слева'
    : (k.owner === myFaction ? 'под твоим контролем' : 'клик — захватить');
  kpInfo.innerHTML = `<b>${k.ru}</b><span>${typ}</span><span>владелец: ${owner}</span><em>${hint}</em>`;
  kpInfo.style.borderColor = '#' + kpColor(k).toString(16).padStart(6, '0');
  kpInfo.classList.add('show');
  clearTimeout(showKPInfo._t);
  showKPInfo._t = setTimeout(() => kpInfo.classList.remove('show'), 3200);
}

let downX = 0, downY = 0, downT = 0, moved = false;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = false; });
cvs.addEventListener('pointermove', e => { if (downT && Math.hypot(e.clientX - downX, e.clientY - downY) > 6) moved = true; });
cvs.addEventListener('pointerup', e => {
  const quick = performance.now() - downT < 350; downT = 0;
  if (moved || !quick) return;
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hits = ray.intersectObjects(kpPick, false);
  if (hits.length) {
    const k = hits[0].object.userData.kp;
    if (myFaction) captureKP(k);
    showKPInfo(k);
  }
});

/* ---- обновление точек (пульс аномалий, вращение маркеров, подписи) ---- */
function updateKeypoints(dt, tx, tz) {
  const t = performance.now() * 0.001;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  const showKP = zoom01 > 0.42;
  for (const k of KEYPOINTS) {
    k.ringMat.opacity = (0.5 + 0.35 * pulse) * (k.owner !== 'neutral' ? 1 : 0.7);
    if (k.type === 'anomaly') {
      for (const m of k.cluster) {
        m.position.y = m.userData.base + Math.sin(t * 2 + m.userData.ph) * 0.4;
        m.material.opacity = 0.45 + 0.4 * (0.5 + 0.5 * Math.sin(t * 3 + m.userData.ph));
        m.rotation.y += dt;
      }
    } else if (k.top) k.top.rotation.y += dt * 0.8;

    // подпись
    const el = k.labelEl;
    const d = Math.hypot(tx - k.wx, tz - k.wz);
    if (!showKP || d > 180) { el.style.display = 'none'; continue; }
    tmpV.set(k.wx, k.gTop + (k.type === 'anomaly' ? 2.4 : 3.9), k.wz).project(camera);
    if (tmpV.z < 1 && Math.abs(tmpV.x) < 1.2 && Math.abs(tmpV.y) < 1.2) {
      el.style.display = 'block';
      el.style.left = (tmpV.x * 0.5 + 0.5) * innerWidth + 'px';
      el.style.top = (-tmpV.y * 0.5 + 0.5) * innerHeight + 'px';
      el.style.opacity = THREE.MathUtils.clamp(1 - d / 180, 0, 1);
    } else el.style.display = 'none';
  }
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
const tmpV = new THREE.Vector3();
let zoom01 = 0;
const clock = new THREE.Clock();

const zoneReveal = new Float32Array(ZONES.length);   // 0..1 на зону
const zoneShrink = new Float32Array(ZONES.length);    // 0..1 — насколько сжат ландмарк при приближении

function updateBuildings() {
  for (let i = 0; i < buildingVox.length; i++) {
    const v = buildingVox[i];
    const rise = zoneReveal[v.zone] * (maxLayer + 1.5);
    const s = THREE.MathUtils.clamp(rise - v.layer, 0, 1);
    if (s <= 0.001) {
      dummy.position.set(0, -9999, 0); dummy.scale.set(0.0001, 0.0001, 0.0001);
    } else {
      // при близком приближении крупный ландмарк (кораблик, вышки и т.п.)
      // плавно уменьшается вокруг СВОЕГО центра, а не центра региона —
      // иначе разбросанные по региону постройки будут «улетать» к центру
      const shrink = 1 - 0.6 * zoneShrink[v.zone];
      const px = v.pcx + (v.x - v.pcx) * shrink;
      const pz = v.pcz + (v.z - v.pcz) * shrink;
      const sy = s * shrink;
      dummy.position.set(px, v.ground + v.layer * shrink + sy / 2, pz);
      dummy.scale.set(shrink, sy, shrink);
    }
    dummy.updateMatrix();
    buildings.setMatrixAt(i, dummy.matrix);
  }
  buildings.instanceMatrix.needsUpdate = true;
}
updateBuildings();

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);

  controls.update();
  clampToMap();

  // ---- зум ----
  const dist = camera.position.distanceTo(controls.target);
  zoom01 = THREE.MathUtils.clamp((controls.maxDistance - dist) / (controls.maxDistance - controls.minDistance), 0, 1);

  // ---- здания: появляются при приближении к региону ----
  const zoomFactor = smooth(THREE.MathUtils.clamp((zoom01 - 0.30) / 0.30, 0, 1));
  const tx = controls.target.x, tz = controls.target.z;
  for (let i = 0; i < ZONES.length; i++) {
    const zc = ZONES[i];
    const d = Math.hypot(tx - zc.wx, tz - zc.wz);
    const prox = smooth(THREE.MathUtils.clamp(1 - (d - 70) / 200, 0, 1));  // близко=1, далеко=0
    const target = zoomFactor * prox;
    zoneReveal[i] += (target - zoneReveal[i]) * (1 - Math.pow(0.5, dt / 0.18)); // плавно

    // ландмарк сжимается только когда камера реально нацелена именно на этот регион
    const shrinkTarget = smooth(THREE.MathUtils.clamp((zoom01 - 0.55) / 0.30, 0, 1)) * prox;
    zoneShrink[i] += (shrinkTarget - zoneShrink[i]) * (1 - Math.pow(0.5, dt / 0.18));
  }
  updateBuildings();

  updateKeypoints(dt, tx, tz);

  // маркеры: луч базы ярче издалека, вблизи слабеет (но остаётся для навигации)
  const beamVis = 1 - smooth(THREE.MathUtils.clamp((zoom01 - 0.4) / 0.4, 0, 1));
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.003);
  for (const b of beacons) {
    if (b.beam) { b.mat.opacity = 0.12 + beamVis * 0.45; }
    const near = 0.3 + 0.7 * (1 - zoom01);
    let d = (0.35 + 0.25 * (b.base ? pulse : 0.5)) * near;
    if (b.anomaly) d = (0.4 + 0.5 * pulse) * near;
    b.discMat.opacity = d;
  }

  // ---- время суток ----
  timeOfDay = (timeOfDay + dt / DAY_LEN) % 1;
  const sunAngle = (timeOfDay - 0.25) * Math.PI * 2;
  const sunH = Math.sin(sunAngle);
  sun.position.set(Math.cos(sunAngle) * 200, Math.max(-40, sunH * 220), 80);
  const daylight = THREE.MathUtils.clamp(sunH * 1.2 + 0.35, 0.05, 1);

  // ---- погода: плавный переход к цели ----
  wxTimer += dt;
  if (wxTimer > 30) pickWeather(true);
  const k = 1 - Math.pow(0.5, dt / 1.6);
  wxCur.fog += (wxTarget.fog - wxCur.fog) * k;
  wxCur.rain += (wxTarget.rain - wxCur.rain) * k;
  wxCur.dark += (wxTarget.dark - wxCur.dark) * k;
  wxCur.tintC.lerp(wxTarget.tintC, k);

  // небо = цвет времени суток, приглушённый погодой
  skyC.copy(skyColor(timeOfDay)).lerp(wxCur.tintC, 0.35 * wxCur.dark + 0.15);
  scene.background = skyC;
  scene.fog.color.copy(skyC).multiplyScalar(0.9);
  scene.fog.density = wxCur.fog * (0.06 + 0.94 * zoom01 * zoom01);

  const light = daylight * (1 - wxCur.dark * 0.6);
  sun.intensity = 0.4 + light * 1.7;
  sun.color.copy(skyColor(timeOfDay)).lerp(new THREE.Color(0xfff2d0), 0.6);
  hemi.intensity = 0.3 + light * 0.5;
  ambient.intensity = 0.35 + (1 - light) * 0.25;

  // ---- дождь ----
  const rainOn = wxCur.rain;
  rainMat.opacity = rainOn * 0.55;
  if (rainOn > 0.02) {
    const p = rainGeo.attributes.position.array;
    const cx = controls.target.x, cz = controls.target.z;
    for (let i = 0; i < RAIN_N; i++) {
      p[i * 3 + 1] -= rainVel[i] * (60 * dt) * (0.6 + rainOn);
      if (p[i * 3 + 1] < 0) {
        p[i * 3] = cx + (Math.random() - 0.5) * GX;
        p[i * 3 + 1] = 110;
        p[i * 3 + 2] = cz + (Math.random() - 0.5) * GZ;
      }
      p[i * 3] += 6 * dt; // ветер
    }
    rainGeo.attributes.position.needsUpdate = true;
    rain.visible = true;
  } else { rain.visible = false; }

  // ---- HUD-подписи ----
  const showKey = THREE.MathUtils.clamp((zoom01 - 0.1) / 0.2, 0, 1);
  let nearestCam = null, nd = Infinity;
  for (let i = 0; i < ZONES.length; i++) {
    const z = ZONES[i];
    const gTop = topAtWorld(z.wx, z.wz);
    tmpV.set(z.wx, gTop + 4, z.wz);
    const wpos = tmpV.clone();
    tmpV.project(camera);
    const el = labelEls[i];
    const onScreen = tmpV.z < 1 && Math.abs(tmpV.x) < 1.3 && Math.abs(tmpV.y) < 1.3;
    // база — всегда; ключевые зоны — при среднем зуме
    const wantShow = z.base ? 1 : showKey * (zoom01 < 0.9 ? 1 : 0);
    if (onScreen && wantShow > 0.05) {
      const sx = (tmpV.x * 0.5 + 0.5) * innerWidth;
      const sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
      el.style.display = 'block';
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      el.style.opacity = wantShow;
    } else {
      el.style.display = 'none';
    }
    // ближайшая к центру камеры — для «СЕКТОР»
    const d = (z.wx - controls.target.x) ** 2 + (z.wz - controls.target.z) ** 2;
    if (d < nd) { nd = d; nearestCam = z; }
  }
  if (nearestCam) sectorEl.textContent = 'СЕКТОР: ' + nearestCam.en;

  // ---- телеметрия ----
  const hh = Math.floor(timeOfDay * 24);
  const mm = Math.floor((timeOfDay * 24 % 1) * 60);
  clockEl.textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  const radBase = nearestCam && nearestCam.anomaly ? 6 : 0.3;
  const radVal = (radBase + wxCur.rain * 1.5 + Math.random() * 0.3).toFixed(2);
  radEl.textContent = radVal + ' μSv';
  radEl.className = 'v' + (radBase > 3 ? ' hot' : wxCur.rain > 0.4 ? ' warn' : '');

  renderer.render(scene, camera);
}

/* ---- запуск ---- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const boot = document.getElementById('boot');
document.getElementById('bootMsg').textContent = 'сборка карты: ' + (groundCount + buildingVox.length).toLocaleString('ru') + ' вокселей (карта ×3) …';
requestAnimationFrame(() => {
  frame();
  setTimeout(() => boot.classList.add('hide'), 400);
});

// на всякий случай — если three не подгрузился
setTimeout(() => {
  if (!renderer.info.render.frame) {
    document.getElementById('bootMsg').textContent = 'ошибка загрузки three.js — проверь сеть';
  }
}, 4000);
</script>
